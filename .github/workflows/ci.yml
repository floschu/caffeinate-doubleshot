name: CI

# Pushes to other branches run through pull_request only, so a PR builds once.
# Tags run this through release.yml. Run any branch by hand with workflow_dispatch.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A new push cancels the running build for the same branch or PR.
# Release tags (via release.yml) are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      BASH_ENV: ${{ github.workspace }}/.github/ci-helpers.sh
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          bash -n src/caffeinate-doubleshot.sh src/install.sh src/doubleshot
          zsh -n src/_doubleshot
          plutil -lint src/at.flosch.caffeinate-doubleshot.plist

      - name: Install
        run: |
          ./src/install.sh
          ./src/install.sh   # running it again updates in place
          doubleshot
          [ -f /Library/PrivilegedHelperTools/caffeinate-doubleshot.sh ]
          [ -f /usr/local/share/zsh/site-functions/_doubleshot ]
          [ -f /etc/newsyslog.d/caffeinate-doubleshot.conf ]

      - name: Shell completion
        run: |
          # compinit picks up _doubleshot from the default fpath.
          /bin/zsh -f -c 'autoload -U compinit; compinit -u -D; [[ ${_comps[doubleshot]} == _doubleshot ]]'

      - name: caffeinate disables sleep, stopping it restores sleep
        run: |
          expect_sleep_disabled 0
          caffeinate -t 120 & pid=$!
          expect_sleep_disabled 1
          doubleshot
          kill "$pid"
          expect_sleep_disabled 0
          doubleshot log

      - name: Disable and enable
        run: |
          caffeinate -t 300 & pid=$!
          expect_sleep_disabled 1
          doubleshot disable
          expect_sleep_disabled 0
          doubleshot | grep 'disabled (doubleshot enable)'
          sleep 6
          expect_sleep_disabled 0   # stays off while caffeinate runs
          ./src/install.sh | grep 'It is disabled'   # an update keeps it disabled
          sleep 6
          expect_sleep_disabled 0
          doubleshot enable
          expect_sleep_disabled 1
          doubleshot | grep -E 'Daemon: +running'
          kill "$pid"
          expect_sleep_disabled 0

      - name: Battery limit
        run: |
          [ "$(doubleshot battery)" = 15% ]
          doubleshot battery 30
          [ "$(doubleshot battery)" = 30% ]
          if doubleshot battery 101; then exit 1; fi

      - name: Uninstall
        run: |
          doubleshot disable   # uninstall also clears the stored disabled flag
          caffeinate -t 120 &
          sleep 5
          doubleshot uninstall
          pmset -g | grep -E 'SleepDisabled[[:space:]]+0'
          [ ! -e /usr/local/bin/doubleshot ]
          [ ! -e /usr/local/share/zsh/site-functions/_doubleshot ]
          [ ! -e /Library/LaunchDaemons/at.flosch.caffeinate-doubleshot.plist ]
          [ ! -e /Library/PrivilegedHelperTools/caffeinate-doubleshot.sh ]
          [ ! -e /usr/local/bin/caffeinate-doubleshot.sh ]
          [ ! -e /etc/newsyslog.d/caffeinate-doubleshot.conf ]
          [ ! -e /usr/local/etc/caffeinate-doubleshot.conf ]
          ./src/doubleshot enable 2>&1 | grep 'is not installed'   # a clear error, no sudo
          if launchctl print-disabled system | grep -E '"at.flosch.caffeinate-doubleshot" => (disabled|true)'; then exit 1; fi

      - name: Update to the latest release
        # Skipped for release tags: the release being made is not published yet.
        if: github.ref_type != 'tag'
        run: |
          ./src/install.sh
          doubleshot battery 30
          [ "$(doubleshot version)" = dev ]
          if doubleshot update 1.2; then exit 1; fi     # not a version
          if doubleshot update 9.9.9; then exit 1; fi   # no such release
          doubleshot update v1.0.0                      # a given, older release
          [ "$(doubleshot version)" = 1.0.0 ]
          [ ! -e /Library/PrivilegedHelperTools/caffeinate-doubleshot.sh ]   # old layout, new files removed
          [ ! -e /etc/newsyslog.d/caffeinate-doubleshot.conf ]
          ./src/install.sh
          [ -f /Library/PrivilegedHelperTools/caffeinate-doubleshot.sh ]
          [ ! -e /usr/local/bin/caffeinate-doubleshot.sh ]                   # upgrade removes the old daemon
          doubleshot update
          doubleshot version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          doubleshot update | grep 'Already on'
          [ "$(doubleshot battery)" = 30% ]   # update keeps the setting
          doubleshot uninstall
