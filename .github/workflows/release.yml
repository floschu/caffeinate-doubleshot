name: Release

# Release by pushing a tag: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          v=${GITHUB_REF_NAME#v}
          sed -i "s/^VERSION=dev /VERSION=$v /" src/install.sh src/doubleshot
          for f in src/install.sh src/doubleshot; do grep "^VERSION=$v " "$f"; done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            src/install.sh src/doubleshot src/_doubleshot src/caffeinate-doubleshot.sh src/at.flosch.caffeinate-doubleshot.plist
